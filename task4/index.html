<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Table and Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="navbar">
        <a href="../task1/index.html">Task 1</a>
        <a href="../task2/index.html">Task 2</a>
        <a href="../task3/index.html">Task 3</a>
        <a href="index.html">Task 4</a>
        <a href="index.html">Task 5</a>
    </div>

    <h2 id="grades-title">Grades Table</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Daniyar</td>
                <td>English</td>
                <td>88</td>
            </tr>
            <tr class="highlight-row">
                <td>Math</td>
                <td>91</td>
            </tr>
            <tr>
                <td>Asel</td>
                <td>CS</td>
                <td>92</td>
            </tr>
            <tr>
                <td>Nurlan</td>
                <td>Physics</td>
                <td>79</td>
            </tr>
        </tbody>
    </table>

    <h2>Feedback Form</h2>

    <form id="feedback-form" class="feedback-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="role">Role:</label>
        <select id="role" name="role">
            <option>Student</option>
            <option>Teacher</option>
            <option>Other</option>
        </select>

        <label>Are you satisfied?</label>
        <div class="radio-group">
            <label><input type="radio" name="satisfied" value="yes"> Yes</label>
            <label><input type="radio" name="satisfied" value="no"> No</label>
        </div>

        <label for="comments">Comments:</label>
        <textarea id="comments" name="comments" rows="4"></textarea>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
